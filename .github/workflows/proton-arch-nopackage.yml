name: Proton nopackage Arch Linux CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            zip \
            patch \
            python \
            python-fonttools \
            rsync \
            wget \
            curl \
            pkgconf \
            cmake \
            ninja \
            bison \
            flex \
            fontconfig \
            fontforge \
            freetype2 \
            gnutls \
            libx11 \
            libxext \
            libxinerama \
            libxrandr \
            libxrender \
            libxcomposite \
            libxi \
            libxcursor \
            vulkan-icd-loader \
            vulkan-headers \
            mesa \
            wayland \
            wayland-protocols \
            mingw-w64-gcc

      - name: Configure & Compile Proton-tkg
        run: |
          cd proton-tkg

          # 1. Non-interactive flags & WoW64 checks in proton-tkg.sh
          sed -i 's/_no_steampath="false"/_no_steampath="y"/' proton-tkg.sh
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh
          sed -i 's/if \[ "\$_NOLIB32" != "true" \]; then/if [ "$_NOLIB32" != "true" ] \&\& [ "$_NOLIB32" != "wow64" ]; then/g' proton-tkg.sh

          # 2. Stub out Linux Steam bridge functions (Windows Steam handles steamclient natively inside prefix)
          sed -i 's/^function build_lsteamclient {/function build_lsteamclient { return 0;/' proton-tkg.sh
          sed -i 's/^function build_steamhelper {/function build_steamhelper { return 0;/' proton-tkg.sh
          sed -i 's/^function build_vrclient {/function build_vrclient { return 0;/' proton-tkg.sh
          sed -i 's/^function build_mediaconverter {/function build_mediaconverter { return 0;/' proton-tkg.sh

          # 3. Safely replace Proton subshells with ( true ) to keep syntax intact
          sed -i 's/( cd Proton.*/( true )/g' proton-tkg.sh
          sed -i 's/(cd Proton.*/( true )/g' proton-tkg.sh

          # 4. Preserve valid syntax in GStreamer move/strip conditionals
          sed -i 's|strip --strip-unneeded "$_nowhere"/gst.*|true|g' proton-tkg.sh
          sed -i 's|mv "$_nowhere"/gst.*|true|g' proton-tkg.sh

          # 5. Truncate outdated Proton redirect patches that conflict with upstream Wine 11 master
          find "$GITHUB_WORKSPACE" -type f \( -name "*steamclient-swap*" -o -name "proton-tkg.patch" -o -name "proton-steam-bits-non-protonify.patch" \) -exec truncate -s 0 {} +

          # 6. Generate unified configuration targeting Upstream Wine Master
          cat << "EOF" > proton-tkg.cfg
          _LOCAL_PRESET="none"
          _custom_wine_source="https://gitlab.winehq.org/wine/wine.git"
          _plain_version=""
          _proton_branch="experimental_11.0"
          _use_staging="false"
          _protonify="false"
          _proton_use_steamhelper="false"
          _proton_fsync="false"
          _NOLIB32="wow64"
          _no_steampath="y"
          _no_container="true"
          _ci_build="true"
          _steamvr_support="false"
          _build_gstreamer="false"
          _build_mediaconv="false"
          uninstaller="true"
          autoinstall="true"
          EOF

          # Mirror configuration to advanced-customization.cfg
          mkdir -p proton-tkg-profiles
          cp proton-tkg.cfg proton-tkg-profiles/advanced-customization.cfg

          # 7. Execute build script capturing exit code correctly
          export MAKEFLAGS="-j$(nproc)"
          set -o pipefail
          yes | ./proton-tkg.sh 2>&1 | tee build.log
          build_rc=${PIPESTATUS[1]}
          exit $build_rc

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "### Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: proton-tkg/build.log

      - name: Upload Proton Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam
          path: |
            proton-tkg/built/
            proton-tkg/non-makepkg-builds/
