## 2. WoW64 master workflow — the patch failure

The error is `proton-tkg-steamclient-swap-wow64.patch` failing to apply. Despite `_steamclient_noswap="true"`, this patch is **not** suppressed by that flag — it's a separate WoW64 memory-layout patch that's always applied in WoW64 mode.

Let me look at the actual patch-selection code to find the right pin commit.
