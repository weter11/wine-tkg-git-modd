name: Proton Valve Exp Bleeding Edge sniper container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest          # ← was: implicit ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: |
          pacman -Syu --noconfirm base-devel sudo
          useradd user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R ..
          chown user -R /tmp
          export CARGO_HOME="$PWD"
          cd proton-tkg
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          printf '_LOCAL_PRESET="valve-exp-bleeding"\n' >> proton-tkg.cfg
          printf '_steamclient_noswap="true"\n_NOLIB32="false"\n' >> proton-tkg-profiles/advanced-customization.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh   # ← run inside Arch, not the sniper container
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz
          yes|./proton-tkg.sh
          cd built && zip -r proton-tkg-build.zip proton_tkg_*
      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-build
          path: proton-tkg/built/*.zip
