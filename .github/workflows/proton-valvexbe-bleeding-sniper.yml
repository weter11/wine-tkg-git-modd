name: Proton Valve Exp Bleeding Edge sniper container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"
      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'
      - uses: actions/checkout@v7
      - name: Compile
        run: |
          cd proton-tkg
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          # Disable the 0001-proton-steamclient-swap-revert-be hotfix that
          # targets Proton ≤10.x Wine sources and now fails to apply cleanly
          # on the bleeding-edge experimental_11.0 tree. The revert is already
          # baked into the upstream Valve tree at this commit range.
          sed -i '/0001-proton-steamclient-swap-revert-be/d' \
            wine-tkg-git/wine-tkg-patches/hotfixes/valve/proton-tkg-steamclient-swap.patch 2>/dev/null || true
          sed -i 's/_no_container="true"/_no_container="false"/' proton-tkg.sh
          # Bleeding edge uses classic multilib (wow64 is unsupported for Valve trees).
          # Only override _steamclient_noswap to match the split-runtime CachyOS model.
          printf '_steamclient_noswap="true"\n' >> proton-tkg-profiles/advanced-customization.cfg
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz
          yes|./proton-tkg.sh
          # Package as zip instead of tar
          cd built && zip -r proton-tkg-build.zip proton_tkg_*
      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-build
          path: proton-tkg/built/*.zip
