name: Proton Valve xbe CI (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"

      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'

      - uses: actions/checkout@v7

      - name: Compile
        run: |
          cd proton-tkg

          # --- Valve Experimental Bleeding Edge wine tree ---
          printf '_LOCAL_PRESET="valve-exp-bleeding"\n' >> proton-tkg.cfg

          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="true"/_no_container="false"/' proton-tkg.sh

          # NOTE: Do NOT set _steamclient_noswap. On experimental_11.0 the valve
          # hotfixes script would copy 0001-proton-steamclient-swap-revert-be.mypatch
          # (a proton-7.0-era patch editing files deleted in 11.0) and the build dies.
          # Leave the default swap in place (correct for running Steam games).

          # --- Neutralize the steamclient-noswap hotfix block so it can never fire ---
          sed -i '/^if \[ "\$_steamclient_noswap" = "true" \]; then/,/^fi$/d' \
            ../wine-tkg-git/wine-tkg-patches/hotfixes/valve/hotfixes

          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz

          export MAKEFLAGS="-s"

          # Run proton-tkg.sh directly (CI mode, _ci_build=true, needs no yes
          # prompts). Redirect output to build.log and report its true exit
          # code. The previous yes|...|tee+pipefail approach let yes's SIGPIPE
          # (141) leak into the step result even on a successful build.
          ./proton-tkg.sh > build.log 2>&1
          build_rc=$?
          exit $build_rc

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-valvexbe-bleeding-build-log
          path: proton-tkg/build.log

      - name: Package artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-valvexbe.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-valvexbe-bleeding-build
          path: proton-tkg/built/*.zip
