name: Proton Valve xbe CI (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"
      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          cd proton-tkg

          # --- Valve Experimental Bleeding Edge wine tree ---
          printf '_LOCAL_PRESET="valve-exp-bleeding"\n' >> proton-tkg.cfg

          # --- base build settings ---
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="true"/_no_container="false"/' proton-tkg.sh

          # --- Windows Steam client instead of swapped-in Linux steamclient ---
          printf '_steamclient_noswap="true"\n' \
            >> proton-tkg-profiles/advanced-customization.cfg

          # --- Disable incompatible hotfix for experimental_11.0 ---
          # 0001-proton-steamclient-swap-revert-be.mypatch targets
          # Proton ≤10.x source layout. experimental_11.0 has moved those
          # symbols, causing a patch-apply failure.
          rm -f ../wine-tkg-git/wine-tkg-patches/hotfixes/valve/0001-proton-steamclient-swap-revert-be.mypatch

          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz

          # --- quiet the build so the step doesn't get truncated ---
          export MAKEFLAGS="-s"
          set -o pipefail

          yes | ./proton-tkg.sh 2>&1 | tee build.log

      - name: Show build errors if it failed
        if: failure()
        run: |
          echo "### Build failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found, check the full log artifact." \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-valvexbe-bleeding-build-log
          path: proton-tkg/build.log

      - name: Package artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-valvexbe.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-valvexbe-bleeding-build
          path: proton-tkg/built/*.zip
