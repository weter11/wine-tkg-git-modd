name: Proton master wine + wow64 sniper container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"
      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'
      - uses: actions/checkout@v7
            - name: Compile
        run: |
          cd proton-tkg
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/LOCAL_PRESET=""/LOCAL_PRESET="none"/' proton-tkg.cfg
          printf '_steamclient_noswap="true"\n_NOLIB32="wow64"\n' >> proton-tkg-profiles/advanced-customization.cfg
          sed -i 's/if \[ "\$_NOLIB32" != "true" \]; then/if [ "$_NOLIB32" != "true" ] \&\& [ "$_NOLIB32" != "wow64" ]; then/' proton-tkg.sh
          sed -i 's/_no_container="true"/_no_container="false"/' proton-tkg.sh
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz
          # Quiet build: full log to file, only errors/summary on console
          export MAKEFLAGS="-s --no-print-directory"
          yes | ./proton-tkg.sh > build.log 2>&1 || true
          echo "===== FILTERED BUILD ERRORS ====="
          grep -niE 'error:|fatal error|recipe for target .* failed|undefined reference|cannot find|command not found|No such file or directory|make\[[0-9]+\]: \*\*\*' build.log | head -n 80 || true
          echo "===== LAST 150 LINES ====="
          tail -n 150 build.log
          if grep -qiE 'recipe for target .* failed|fatal error' build.log; then
            echo "BUILD FAILED — see filtered output above and the build.log artifact"; exit 1
          fi
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: master-wow64-build-log
          path: proton-tkg/build.log
