name: Proton master wow64 CI (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v7

      - name: Compile
        run: |
          # --- force --noconfirm on every pacman call ---
          cat > /usr/local/bin/pacman <<'PACWRAP'
          #!/bin/bash
          exec /usr/bin/pacman --noconfirm "$@"
          PACWRAP
          chmod +x /usr/local/bin/pacman
          export PATH="/usr/local/bin:$PATH"

          pacman -Syu base-devel sudo zip git
          useradd user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R ..
          chown user -R /tmp
          export CARGO_HOME="$PWD"
          cd proton-tkg

          # --- Export the proton-build knobs as env vars so they reach BOTH
          # proton-tkg.sh AND its child non-makepkg-build.sh regardless of which
          # cfg file each one sources. The cfg sourcing chain is inconsistent
          # (proton-tkg.sh never reads advanced-customization.cfg; non-makepkg's
          # dep-install gate reads _NOLIB32 before the wine checkout), so env
          # propagation is the reliable path.
          export _NOLIB32="wow64"
          export _steamvr_support="false"
          export _plain_version="7177ece86ca3ab0bd2da0e091c143aa888d856de"
          export _staging_upstreamignore="true"
          export _use_staging="false"

          # --- master wine (NOT Valve) ---
          sed -i 's/LOCAL_PRESET=""/LOCAL_PRESET="none"/' proton-tkg.cfg

          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh

          # --- proton-side config: proton-tkg.sh does NOT source advanced-customization.cfg,
          # so set the proton-build defaults directly here (same pattern as the NOLIB32 sed below).
          sed -i 's/_steamvr_support="true"/_steamvr_support="false"/' proton-tkg.sh
          # Disable the Rust mediaconverter/gstreamer build: it fails to build
          # in this container and isn't needed for Windows-Steam. _init sources
          # proton-tkg.cfg, so flip the default there.
          sed -i 's/_build_mediaconv="true"/_build_mediaconv="false"/' proton-tkg.cfg
          sed -i 's/_NOLIB32="false"/_NOLIB32="wow64"/' proton-tkg.sh

          # --- VARIANT A (with lsteamclient bridge): keep build_lsteamclient (the
          # game-side steamclient bridge needed for Proton+Windows-Steam), but skip
          # build_steamhelper. steamhelper runs winemaker --wine32 which needs a
          # wine32 prefix absent in this container, and with an external Windows
          # steam.exe we don't need Proton's steam.exe shim. build_lsteamclient's
          # own win32 branch is already guarded to skip for _NOLIB32="wow64".
          sed -i '/^      build_steamhelper$/d' proton-tkg.sh
          # build_vrclient needs openvr + winemaker --wine32 (wine32 prefix
          # absent in container); VR is noted broken upstream and not needed for an
          # external Windows steam.exe. earlyhotfixer re-sets _steamvr_support=true
          # during patching, so deleting the call is the reliable skip.
          sed -i '/^        build_vrclient$/d' proton-tkg.sh

          # --- disable wine-staging: the fork's default staging version expects a
          # different wine base than 7177ece8, so staging/patchinstall fails and
          # shifts the context the swap patch needs. The swap patch is proven to
          # apply cleanly on plain 7177ece8 without staging; staging compat fixes
          # can be re-pinned later once a matching staging version is chosen.
          printf '_use_staging="false"\n' >> proton-tkg.cfg

          # --- pin to the commit the rebased swap patch targets ---
          printf '_plain_version="7177ece86ca3ab0bd2da0e091c143aa888d856de"\n' >> proton-tkg.cfg

          # --- make the commit pin actually land ---
          # PKGBUILD / non-makepkg only emit #commit= (vs origin/HEAD) when _use_staging
          # is false OR (_use_staging=true AND _staging_upstreamignore=true). The fork
          # defaults to _use_staging=true, so without this the build silently uses
          # origin/HEAD (master) and the 7177ece8-rebased swap patch fails to apply.
          # Write it to BOTH proton-tkg.cfg (sourced first in _init) and
          # advanced-customization.cfg to remove any sourcing-path ambiguity.
          printf '_staging_upstreamignore="true"\n' >> proton-tkg.cfg
          printf '_staging_upstreamignore="true"\n' \
            >> proton-tkg-profiles/advanced-customization.cfg

          # --- debug: confirm the workflow actually set the pin vars ---
          echo "DEBUG workflow vars: _plain_version=$(grep -m1 _plain_version proton-tkg.cfg | tail -1) _staging_upstreamignore=$(grep -m1 _staging_upstreamignore proton-tkg.cfg | tail -1) proton _steamvr_support=$(grep -m1 _steamvr_support proton-tkg.sh | tail -1) proton _NOLIB32=$(grep -m1 _NOLIB32 proton-tkg.sh | tail -1)"

          # --- _NOLIB32="wow64": Proton-compatible WoW64. Proton builds forbid pure
          # _NOLIB32="true" (prepare.sh forces it back to false), so wow64 is the mode
          # that skips 32-bit dep install AND serves 32-bit games via the 64-bit prefix.
          # The 32-bit lsteamclient build is skipped (no wine32 prefix); 64-bit Windows
          # Steam + DX12 games use the win64 lsteamclient.dll.so bridge. ---
          # VR support is broken and pulls in a winemaker/openvr step that needs the
          # Proton tree (not cloned under _no_container="true") -> disable it.
          printf '_NOLIB32="wow64"\n_steamvr_support="false"\n' \
            >> proton-tkg-profiles/advanced-customization.cfg

          # --- Wow64 workaround: lsteamclient/steamhelper do native winegcc -m32
          # under NOLIB32="wow64" (they only special-case "true"). Skip native -m32. ---
          sed -i 's/if \[ "\$_NOLIB32" != "true" \]; then/if [ "$_NOLIB32" != "true" ] \&\& [ "$_NOLIB32" != "wow64" ]; then/' proton-tkg.sh

          echo '_ci_build="true"' >> proton-tkg.cfg

          export MAKEFLAGS="-s"
          set +e

          # yes feeds any (rare) interactive prompt; tee captures full output.
          # We deliberately do NOT use `set -o pipefail`: that would make the
          # pipeline report yes's SIGPIPE (141) when the build finishes and the
          # pipe closes. Without pipefail the pipeline returns tee's status (0),
          # so `set -e` won't abort and we can read proton-tkg.sh's own exit via
          # PIPESTATUS[1]. set +e guards the call so the real exit is captured.
          yes | ./proton-tkg.sh 2>&1 | tee build.log
          build_rc=${PIPESTATUS[1]}
          set -e
          exit $build_rc

      - name: Show build errors if it failed
        if: failure()
        run: |
          echo "### Build failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found, check the full log artifact." \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-build-log
          path: proton-tkg/build.log

      - name: Zip the artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-master-wow64.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-build
          path: proton-tkg/built/*.zip
