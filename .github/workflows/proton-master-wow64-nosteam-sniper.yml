# Proton master wine + WoW64, NO steamclient bridge (Variant B), zip packaging.
# Reworked 2026-07-29:
#   * Dropped the fabricated `mingw-w64-widl` package (no such package exists on
#     Arch or elsewhere; the cross widl is `mingw-w64-tools`, AUR-only on Arch).
#   * Converted from the Arch container to `ubuntu-latest` (no container) so
#     apt's `mingw-w64` provides `x86_64-w64-mingw32-widl` for the vkd3d-proton
#     meson cross-build (the same reason the Valve path builds cleanly).
#   * Stripped the redundant multi-mechanism assignments: each build knob is now
#     written to its SINGLE authoritative source (see comments per var).
#   * Kept the legitimate fixes: PIPESTATUS[1] SIGPIPE handling, the 7177ece8 pin,
#     _NOLIB32=wow64, the vrclient/lsteamclient/steamhelper skips, and the
#     build_lsteamclient win32 wow64 guard.
#
# Verified-against knowledge base: weter11/wine-tkg-git-modd.
# Variant B = NO bridge: Windows steam.exe is expected to serve steamclient to the
# game. build_lsteamclient/build_steamhelper are deleted; the win64 lsteamclient
# .dll.so bridge is NOT produced (so 32-bit-only/bridge-dependent games won't work --
# that is expected for this variant).

name: Proton master wow64 CI - NO steamclient (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"

      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'

      - uses: actions/checkout@v4

      - name: Compile
        run: |
          cd proton-tkg

          # --- master wine (NOT Valve) ---
          sed -i 's/LOCAL_PRESET=""/LOCAL_PRESET="none"/' proton-tkg.cfg

          # --- base build settings ---
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh

          # --- WINE-SIDE config: write to proton-tkg.cfg ONLY. This is the file
          # prepare.sh (_init) and non-makepkg-build.sh both source first for
          # _plain_version / _use_staging. (The fork's non-makepkg-build.sh already
          # honors _plain_version unconditionally, so no script-patch sed needed.) ---
          # Pin wine to the commit the wow64 steamclient-swap patch was rebased for.
          printf '_plain_version="7177ece86ca3ab0bd2da0e091c143aa888d856de"\n' >> proton-tkg.cfg
          # Disable staging: the fork's default _staging_version base mismatches
          # 7177ece8 and staging/patchinstall fails. Plain 7177ece8 + swap patch is
          # the proven combination. (_staging_upstreamignore removed: it only gates
          # prepare.sh's reset, not patchinstall's success, and is redundant once
          # staging is off.)
          printf '_use_staging="false"\n' >> proton-tkg.cfg
          # Disable the Rust mediaconverter/gstreamer build (not needed for
          # Windows-Steam; it fails to build and leaves gst empty -> later `mv` dies).
          sed -i 's/_build_mediaconv="true"/_build_mediaconv="false"/' proton-tkg.cfg

          # --- PROTON-SIDE config: sed directly into proton-tkg.sh. proton-tkg.sh
          # NEVER reads advanced-customization.cfg, so writing these there is a no-op
          # for the Proton build. These are the single authoritative edits. ---
          # _NOLIB32="wow64" = Proton-compatible WoW64 (single 64-bit prefix serves
          # 32-bit games). NOT "true" -- prepare.sh force-reverts "true" to "false",
          # which then demands lib32-* (absent without multilib) and fails.
          sed -i 's/_NOLIB32="false"/_NOLIB32="wow64"/' proton-tkg.sh
          # _steamvr_support="false": VR is noted broken upstream AND build_vrclient
          # needs the Proton tree (not cloned under _no_container="true").
          sed -i 's/_steamvr_support="true"/_steamvr_support="false"/' proton-tkg.sh

          # --- VARIANT B: do NOT build the steamclient/steamhelper bridge. Delete
          # the build calls so no win32/win64 lsteamclient.so / steamhelper.so are
          # produced. (No _steamclient_noswap: the WoW64 swap selector ignores it and
          # still applies the wine-internal swap patch, which is required for the
          # ntdll nice_limit/steamclient_addr symbols the build needs.) ---
          sed -i '/^      build_lsteamclient$/d' proton-tkg.sh
          sed -i '/^      build_steamhelper$/d' proton-tkg.sh
          # earlyhotfixer re-sets _steamvr_support="true" during patching, so the
          # vrclient `if` block would still run (already-deleted build_vrclient) + a
          # bare `cd Proton` that fails in non-makepkg mode. Flip the condition to
          # false so the WHOLE block (build_vrclient + stray cd Proton) is skipped,
          # preserving valid syntax and the legitimate clone-section cd Proton calls.
          sed -i 's/if \[ "\$_steamvr_support" = "true" \]; then/if [ "$_steamvr_support" = "false" ]; then/' proton-tkg.sh

          # --- Wow64 guard: build_lsteamclient/steamhelper do native winegcc -m32
          # under NOLIB32="wow64" (they only special-case "true"). Belt-and-suspenders
          # now that the calls are deleted, but it is the canonical wow64 fix and is
          # harmless. (Skips the win32 branch; the win64 bridge is already gone via the
          # deletes above.) ---
          sed -i 's/if \[ "\$_NOLIB32" != "true" \]; then/if [ "$_NOLIB32" != "true" ] \&\& [ "$_NOLIB32" != "wow64" ]; then/' proton-tkg.sh

          # --- PROBE: confirm the single-source edits actually landed (cheap insurance) ---
          echo "PROBE: $(grep -m1 _NOLIB32 proton-tkg.sh | tail -1) | $(grep -m1 _steamvr_support proton-tkg.sh | tail -1) | $(grep -m1 _plain_version proton-tkg.cfg | tail -1) | $(grep -m1 _use_staging proton-tkg.cfg | tail -1)"

          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz

          export MAKEFLAGS="-s"
          set +e

          # `yes` feeds any rare interactive prompt; tee captures full output.
          # Without `set -o pipefail` the pipeline reports tee's status (0);
          # `yes` dying of SIGPIPE (141) on the closed pipe is ignored. We capture
          # proton-tkg.sh's own exit via PIPESTATUS[1] and return that.
          yes | ./proton-tkg.sh 2>&1 | tee build.log
          build_rc=${PIPESTATUS[1]}
          set -e
          exit $build_rc

      - name: Show build errors if it failed
        if: failure()
        run: |
          echo "### Build failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found, check the full log artifact." \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: proton-tkg/build.log

      - name: Zip the artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-master-wow64-nosteam.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-master-wow64-nosteam
          path: proton-tkg/built/*.zip
