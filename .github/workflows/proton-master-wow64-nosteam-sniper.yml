# Proton master wine + WoW64, NO steamclient bridge (Variant B), zip packaging.
# Reworked 2026-07-29: fresh write, correcting the 32-bit dep leakage from the prior version.
#
# Root cause of the prior failure: `_NOLIB32` must live in `proton-tkg.cfg`
# (which `prepare.sh` sources for the 32-bit dep gate) — NOT only in
# `proton-tkg.sh` (which only controls the Proton build function guards).
# The prior version sed-d `_NOLIB32` into `proton-tkg.sh` but never wrote it
# to `proton-tkg.cfg`, so prepare.sh's dep resolver ran `install_deps "32"`
# → `libgstreamer-plugins-base1.0-dev:i386` → failure.
#
# Key design:
#   - ubuntu-latest, NO container (apt gives us x86_64-w64-mingw32-widl
#     for the vkd3d-proton meson cross-build; Arch does not have it).
#   - drop the fabricated `mingw-w64-widl` package (doesn't exist anywhere).
#   - Each build knob written to its SINGLE authoritative source:
#       * wine-side defaults (_plain_version, _use_staging, _build_mediaconv)
#         → proton-tkg.cfg (sourced first by prepare.sh _init)
#       * proton-side defaults (_NOLIB32, _steamvr_support)
#         → also proton-tkg.cfg (same file; prepare.sh reads them all)
#       * function guards only reachable via proton-tkg.sh itself
#         → sed into proton-tkg.sh (these are redundant with the cfg but
#           harmless as belt-and-suspenders for the build-function phase).
#   - Keep only the proven, necessary sed/printf edits (strip all the
#     advanced-customization.cfg writes for vars that proton-tkg.sh never
#     reads — they were no-ops for the Proton build).
#   - SIGPIPE-safe exit handling (`set +e` + PIPESTATUS[1]).
#
# Variant B = NO lsteamclient/steamhelper bridge: Windows steam.exe is
# the Steam client. build_lsteamclient/build_steamhelper are deleted;
# the win64 lsteamclient.dll.so bridge is not produced (32-bit-only or
# bridge-dependent games won't work — expected for this variant).
#
# No _steamclient_noswap: the WoW64 swap selector ignores it and still
# applies the wine-internal swap patch (required for ntdll symbols).

name: Proton master wow64 CI - NO steamclient (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"

      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'

      - uses: actions/checkout@v7

      - name: Compile
        run: |
          cd proton-tkg

          # --- master wine (NOT Valve) ---
          sed -i 's/LOCAL_PRESET=""/LOCAL_PRESET="none"/' proton-tkg.cfg

          # --- wine-side defaults: written to proton-tkg.cfg (single source,
          # sourced by prepare.sh _init for the dep gate and build config) ---
          # Pin wine to the commit the wow64 steamclient-swap patch was rebased for.
          printf '_plain_version="7177ece86ca3ab0bd2da0e091c143aa888d856de"\n' >> proton-tkg.cfg
          # Disable staging: the fork's default _staging_version base mismatches
          # 7177ece8 and staging/patchinstall fails. Plain 7177ece8 + swap patch
          # is the proven combination.
          printf '_use_staging="false"\n' >> proton-tkg.cfg
          # Disable the Rust mediaconverter/gstreamer build (not needed for
          # Windows-Steam; it fails to build and leaves gst empty, causing
          # a fatal `mv` later). _build_gstreamer is already "false" by default.
          sed -i 's/_build_mediaconv="true"/_build_mediaconv="false"/' proton-tkg.cfg
          # Proton-compatible WoW64 (NOT "true" — prepare.sh force-reverts "true"
          # to "false" and then tries lib32-* deps that don't exist without
          # multilib; "wow64" skips the 32-bit dep install and uses the 64-bit
          # prefix to serve 32-bit games). THIS IS THE FIX for the i386 error.
          printf '_NOLIB32="wow64"\n' >> proton-tkg.cfg
          # Disable VR support: build_vrclient needs openvr + winemaker --wine32
          # which requires a wine32 prefix that isn't built without multilib. VR
          # is also noted broken upstream. _steamvr_support="true" is the default
          # in proton-tkg.cfg/advanced-customization.cfg — override it here.
          printf '_steamvr_support="false"\n' >> proton-tkg.cfg

          # --- proton-tkg.sh function guards (belt-and-suspenders; the cfg
          # values above already control the build correctly, but these seds
          # harden the build-function gates against earlyhotfixer overrides) ---
          # build_vrclient / build_steamhelper / build_lsteamclient are called
          # inside conditional blocks; flip _steamvr_support gate to false so
          # the entire vrclient block (including the stray bare `cd Proton`
          # that fails in non-makepkg mode) is skipped regardless of what
          # earlyhotfixer does to _steamvr_support during the patch phase.
          sed -i 's/if \[ "\$_steamvr_support" = "true" \]; then/if [ "$_steamvr_support" = "false" ]; then/' proton-tkg.sh
          # Wow64 guard for build_lsteamclient build_steamhelper win32 branch
          # (they only special-case "true", not "wow64", so they'd otherwise
          # attempt winegcc -m32 which needs a wine32 prefix we don't have).
          sed -i 's/if \[ "\$_NOLIB32" != "true" \]; then/if [ "$_NOLIB32" != "true" ] \&\& [ "$_NOLIB32" != "wow64" ]; then/' proton-tkg.sh

          # --- Variant B: delete the steamclient/steamhelper bridge build calls
          # (no lsteamclient.so / steamhelper.so produced; Windows steam.exe
          # is expected to serve steamclient to the game). ---
          sed -i '/^      build_lsteamclient$/d' proton-tkg.sh
          sed -i '/^      build_steamhelper$/d' proton-tkg.sh

          # --- base build settings ---
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh

          # --- CI build flag ---
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz

          export MAKEFLAGS="-s"
          set +e

          # yes feeds any rare interactive prompt; tee captures full output.
          # Drop `set -o pipefail`: with pipefail, `yes` dies SIGPIPE (141)
          # when proton-tkg.sh finishes and the pipe closes, making the whole
          # step red even on a successful build. Without pipefail the pipeline
          # returns tee's 0, so set -e does not abort before we read PIPESTATUS.
          yes | ./proton-tkg.sh 2>&1 | tee build.log
          build_rc=${PIPESTATUS[1]}   # index 1 = proton-tkg.sh; index 0 = yes
          set -e
          exit $build_rc

      - name: Show build errors if it failed
        if: failure()
        run: |
          echo "### Build failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference"             proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY"             || echo "No matching error lines found, check the full log artifact."             >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: proton-tkg/build.log

      - name: Zip the artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-master-wow64-nosteam.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam
          path: proton-tkg/built/*.zip
