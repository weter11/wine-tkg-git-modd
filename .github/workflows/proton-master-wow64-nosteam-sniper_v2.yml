# Proton master wine + WoW64, NO steamclient bridge (Variant B), zip packaging.
# v2 2026-07-29: audit fix — 32-bit dep gate was bypassing our _NOLIB32="wow64".
#
# ROOT CAUSE of prior 32-bit failure:
#   wine-tkg-git/wine-tkg-scripts/prepare.sh/_init() sources configs in this order:
#     1. proton_tkg_token
#     2. proton-tkg.cfg          ← our _NOLIB32="wow64" landed here
#     3. proton-tkg-profiles/advanced-customization.cfg   ← OVERWRITES it back to "false"
#
#   advanced-customization.cfg sets _NOLIB32="false" at line 81 and
#   _steamvr_support="true" at line 47. Because it is sourced AFTER
#   proton-tkg.cfg, any write we make to proton-tkg.cfg for those two
#   vars is overwritten before the dep gate in non-makepkg-build.sh
#   runs. Result: install_deps "32" attempted all :i386 packages on
#   ubuntu-latest (which does not ship them) → configure: error for
#   wine-32 — exactly what the v1 build log (30472004575) shows.
#
#   _plain_version / _use_staging / _build_mediaconv only live in
#   proton-tkg.cfg, so they were correctly placed in v1.
#
# CORRECTED SINGLE-SOURCE MAP:
#   Wine-side defaults:
#     _plain_version, _use_staging, _build_mediaconv → proton-tkg.cfg (only place they exist)
#   Proton-side defaults (overwritten by advanced-customization.cfg):
#     _NOLIB32, _steamvr_support → proton-tkg-profiles/advanced-customization.cfg (last source before dep gate)
#   Proton-side token (sourced in build_lsteamclient / build_steamhelper):
#     _steamclient_noswap          → proton-tkg.cfg (TOKEN path; also mirrored to advanced-customization.cfg)
#
# STRATEGY for Variant B = NO bridge (Windows steam.exe is the client):
#   _steamclient_noswap="true" tells proton-tkg to NOT substitute
#   lsteamclient.dll.so / steamhelper.dll.so for the Linux steamclient.
#   build_lsteamclient / build_steamhelper calls are deleted.
#   _NOLIB32="wow64" disables 32-bit deps and forces the win64-only
#   prefix; 32-bit Windows games if any use WoW64 emulation.
#   _steamvr_support="false" skips build_vrclient entirely.
#
# With these settings the build needs only 64-bit Ubuntu packages — no
# :i386, no multilib, no mingw-w64 cross-tools (mingw-w64-widl dropped,
# action never added anything; vkd3d-proton meson needs x86_64-w64-mingw32-widl
# only when building vrclient/lsteamclient in 32-bit mode — we don't).
#
# Actions v7 is latest (confirmed via GitHub API); not pinned to a version.
#
# Last planned check: upstream wine-tkg-git last commit was ~2 weeks ago;
# nothing landed that would require revisiting the 7177ece8 pin.

name: Proton master wow64 CI - NO steamclient v2 (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"

      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'

      - uses: actions/checkout@v7

      - name: Compile
        run: |
          cd proton-tkg

          # --- master wine (NOT Valve) ---
          sed -i 's/LOCAL_PRESET=""/LOCAL_PRESET="none"/' proton-tkg.cfg

          # --- Wine-side defaults: only in proton-tkg.cfg ---
          # Pin wine to the commit the wow64 steamclient-swap patch was rebased for.
          printf '_plain_version="7177ece86ca3ab0bd2da0e091c143aa888d856de"\n' >> proton-tkg.cfg
          # Disable staging: staging/patchinstall base mismatches 7177ece8.
          printf '_use_staging="false"\n' >> proton-tkg.cfg
          # Disable Rust mediaconverter (not needed for Windows-Steam;
          # leaves gst empty and causes a fatal mv later).
          sed -i 's/_build_mediaconv="true"/_build_mediaconv="false"/' proton-tkg.cfg

          # --- Proton-side defaults: advanced-customization.cfg sources LAST before dep gate ---
          # Do NOT write these to proton-tkg.cfg — prepare.sh/_init sources
          # advanced-customization.cfg AFTER proton-tkg.cfg and clobbers any
          # _NOLIB32/_steamvr_support we write there.
          # _steamclient_noswap goes to BOTH cfg+advanced-customization.cfg because
          # the token is read early (separate source) to gate the proton patching.
          printf '_NOLIB32="wow64"\n' >> proton-tkg-profiles/advanced-customization.cfg
          printf '_steamvr_support="false"\n' >> proton-tkg-profiles/advanced-customization.cfg
          printf '_steamclient_noswap="true"\n' >> proton-tkg.cfg
          printf '_steamclient_noswap="true"\n' >> proton-tkg-profiles/advanced-customization.cfg

          # --- proton-tkg.sh function gates (belt-and-suspenders) ---
          # Skip the vrclient block entirely regardless of earlyhotfixer re-sets.
          sed -i 's/if \[ "\$_steamvr_support" = "true" \]; then/if [ "$_steamvr_support" = "false" ]; then/' proton-tkg.sh

          # --- Variant B: delete the steamclient/steamhelper bridge build calls ---
          # Windows steam.exe supplies steamclient to the game itself.
          sed -i '/^      build_lsteamclient$/d' proton-tkg.sh
          sed -i '/^      build_steamhelper$/d' proton-tkg.sh

          # --- base build settings ---
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh

          # --- CI build flag (skip interactive prompt) ---
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz

          export MAKEFLAGS="-s"
          set +e

          # yes feeds any rare interactive prompt; tee captures full output.
          # Drop `set -o pipefail`: with pipefail, `yes` dies SIGPIPE (141)
          # when proton-tkg.sh exits and the pipe closes, making the whole
          # step red even on a successful build.
          yes | ./proton-tkg.sh 2>&1 | tee build.log
          build_rc=${PIPESTATUS[1]}   # index 1 = proton-tkg.sh; index 0 = yes
          set -e
          exit $build_rc

      - name: Show build errors if it failed
        if: failure()
        run: |
          echo "### Build failure summary" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          # Surface key proton-side config values so we can debug future i386/missing
          # dep failures without manually grepping the build log.
          { grep -E '_NOLIB32|_steamvr_support|_steamclient_noswap'                 proton-tkg/work/build/proton-tkg* >/dev/null 2>&1             && grep -E '_NOLIB32|_steamvr_support|_steamclient_noswap'                 proton-tkg/work/build/proton-tkg*; }             || echo "proton-tkg token not found in build/; check proton_tkg_token workdir"
          echo >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference"             build.log | tail -150 >> "$GITHUB_STEP_SUMMARY"             || echo "No matching error lines found, check the full log artifact."             >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: build.log

      - name: Zip the artifact
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-master-wow64-nosteam.zip proton_tkg_*

      - name: Archive the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam
          path: proton-tkg/built/*.zip
