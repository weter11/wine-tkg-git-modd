name: Proton Master WoW64 CI - NO steamclient V2 (zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          # Install base build tools, patch (required for wine-tkg patches), Python, and WoW64 MinGW toolchain
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            sudo \
            zip \
            patch \
            python \
            rsync \
            wget \
            curl \
            pkgconf \
            cmake \
            ninja \
            bison \
            flex \
            fontconfig \
            freetype2 \
            gnutls \
            libx11 \
            libxext \
            libxinerama \
            libxrandr \
            libxrender \
            libxcomposite \
            libxi \
            libxcursor \
            vulkan-icd-loader \
            vulkan-headers \
            mesa \
            wayland \
            wayland-protocols \
            mingw-w64-gcc

          # Setup non-root build user
          useradd -m user && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R user:user . /tmp

      - name: Configure & Compile Proton-tkg
        run: |
          su user -c '
            set -euo pipefail
            cd proton-tkg

            # Export environment overrides for WoW64 + Upstream Wine Master
            export _NOLIB32="wow64"
            export _steamvr_support="false"
            export _use_staging="false"
            export _build_gstreamer="false"
            export _build_mediaconv="false"
            export _ci_build="true"
            export MAKEFLAGS="-j$(nproc)"

            # Create unified proton-tkg.cfg targeting Upstream Wine Master
            cat << "EOF" > proton-tkg.cfg
            _LOCAL_PRESET="none"
            _custom_wine_source="https://gitlab.winehq.org/wine/wine.git"
            _plain_version=""
            _use_staging="false"
            _NOLIB32="wow64"
            _no_container="true"
            _ci_build="true"
            _steamvr_support="false"
            _build_gstreamer="false"
            _build_mediaconv="false"
            uninstaller="true"
            autoinstall="true"
            EOF

            # Mirror configuration to advanced-customization.cfg
            mkdir -p proton-tkg-profiles
            cp proton-tkg.cfg proton-tkg-profiles/advanced-customization.cfg

            # Stub out Linux Steam bridge and VR builds
            sed -i "s/.*build_lsteamclient.*/# skipped build_lsteamclient/" proton-tkg.sh
            sed -i "s/.*build_steamhelper.*/# skipped build_steamhelper/" proton-tkg.sh
            sed -i "s/.*build_vrclient.*/# skipped build_vrclient/" proton-tkg.sh

            # Execute build script with pipefail enabled
            set -o pipefail
            ./proton-tkg.sh 2>&1 | tee build.log
          '

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "### Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: proton-tkg/build.log

      - name: Package Artifacts
        if: success()
        run: |
          cd proton-tkg/built
          zip -r proton-tkg-master-wow64-nosteam.zip proton_tkg_*

      - name: Upload Proton Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam
          path: proton-tkg/built/
