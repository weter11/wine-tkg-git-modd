name: Proton Master WoW64 CI - NO steamclient V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            sudo \
            zip \
            patch \
            python \
            rsync \
            wget \
            curl \
            pkgconf \
            cmake \
            ninja \
            bison \
            flex \
            fontconfig \
            freetype2 \
            gnutls \
            libx11 \
            libxext \
            libxinerama \
            libxrandr \
            libxrender \
            libxcomposite \
            libxi \
            libxcursor \
            vulkan-icd-loader \
            vulkan-headers \
            mesa \
            wayland \
            wayland-protocols \
            fontforge \
            python-fonttools \
            mingw-w64-gcc
          # Setup non-root build user and transfer workspace ownership
          useradd -m user && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R user:user "$GITHUB_WORKSPACE" /tmp

      - name: Configure & Compile Proton-tkg
        run: |
          sudo -u user GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c '
            set -eu
            cd "$GITHUB_WORKSPACE/proton-tkg"

            # Export environment variables - MUST use "y" for _no_steampath
            export _NOLIB32="wow64"
            export _no_steampath="y"
            export _steamvr_support="false"
            export _use_staging="false"
            export _build_gstreamer="false"
            export _build_mediaconv="false"
            export _ci_build="true"
            export MAKEFLAGS="-j$(nproc)"

            # GCC 14 made -Wimplicit-function-declaration (and -Wimplicit-int)
            # hard errors by default for C, where older GCC only warned. This
            # pinned wine commit predates that GCC policy change, so any call
            # site relying on an implicit declaration -- previously harmless --
            # now fails the build. Downgrading back to a warning here is the
            # same fix used by other projects hitting this after a toolchain
            # bump (e.g. u-boot), and applies across the whole build via CFLAGS
            # rather than needing a patch at every individual call site.
            export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"

            # Append our overrides to the END of proton-tkg.cfg instead of
            # replacing it outright ("> proton-tkg.cfg" was overwriting the
            # entire file, which silently deleted real defaults we never
            # meant to touch -- e.g. _wayland_driver="true", native Wayland
            # driver support, not just XWayland). tee -a appends the same
            # overrides to advanced-customization.cfg at the same time, since
            # we've seen different variables get read from each file at
            # different points in the build.
            #
            # _plain_version is intentionally empty: it was only ever needed
            # to land on a commit the steamclient-swap patch's ancestor-check
            # would accept. With _unfrog="true" below skipping that patch
            # entirely, there's no more reason to sit on an old, awkward
            # commit -- track live wine master, which is what a "master wine"
            # build should actually mean.
            mkdir -p proton-tkg-profiles
            {
              printf "%s\n" "_LOCAL_PRESET=\"none\""
              printf "%s\n" "_custom_wine_source=\"https://gitlab.winehq.org/wine/wine.git\""
              printf "%s\n" "_plain_version=\"\""
              printf "%s\n" "_use_staging=\"false\""
              printf "%s\n" "_NOLIB32=\"wow64\""
              printf "%s\n" "_no_steampath=\"y\""
              printf "%s\n" "_no_container=\"true\""
              printf "%s\n" "_ci_build=\"true\""
              printf "%s\n" "_steamvr_support=\"false\""
              printf "%s\n" "_build_gstreamer=\"false\""
              printf "%s\n" "_build_mediaconv=\"false\""
              printf "%s\n" "uninstaller=\"true\""
              printf "%s\n" "autoinstall=\"true\""
              # Skips the entire proton-tkg-steamclient-swap patch family
              # (gated by prepare.sh:1035 on _unfrog != "true"), along with a
              # few other Frogging-Family/proton-specific extras (LAA
              # handling, some staging integration). This build already
              # deletes build_lsteamclient/build_steamhelper below, so it
              # doesn't want the steamclient bridge that patch exists to
              # support -- skipping it avoids the whole nice_limit /
              # steamclient_addr / GetPackagesByPackageFamily /
              # __wine_set_unix_env chain of failures we hit chasing patch
              # compatibility for a feature this build was never going to use.
              printf "%s\n" "_unfrog=\"true\""
            } | tee -a proton-tkg.cfg proton-tkg-profiles/advanced-customization.cfg > /dev/null

            # Stub out only the actual call sites (proton-tkg.sh line ~1114 and
            # ~1117), not every line mentioning these names. A broad
            # s/.*build_lsteamclient.*/.../ also matches the function
            # DEFINITION line ("function build_lsteamclient {"), which would
            # comment out the opening brace and leave the whole function body
            # as orphaned top-level code that either fails to parse or runs
            # unconditionally at script load. Anchoring to the exact
            # 6-space-indented bare call line avoids that entirely.
            # build_vrclient needs no sed at all: its only call site is already
            # gated by "if [ \"$_steamvr_support\" = \"true\" ]", and nothing
            # later in the script resets that flag, so _steamvr_support="false"
            # above already skips it cleanly.
            sed -i "/^      build_lsteamclient\$/d" proton-tkg.sh
            sed -i "/^      build_steamhelper\$/d" proton-tkg.sh

            # Execute build and log stdout/stderr
            set -o pipefail
            yes | ./proton-tkg.sh nocontainer 2>&1 | tee build.log
            build_rc=${PIPESTATUS[1]}

            # Record which commit the wine source actually landed on, so a
            # repeat failure can be diagnosed from evidence instead of
            # re-deriving it from the cfg-sourcing chain again. The source
            # directory is cloned early, well before compilation could fail,
            # so it exists regardless of whether the build itself succeeded.
            _wdir=$(find . -maxdepth 1 -iname "wine-*" -type d 2>/dev/null | head -n1)
            if [ -n "$_wdir" ] && [ -e "$_wdir/.git" ]; then
              git -C "$_wdir" log -1 --oneline > wine_commit_actually_checked_out.log 2>&1 || true
            fi

            exit $build_rc
          '

      - name: Show which wine commit was actually used
        if: always()
        run: |
          echo "### Wine commit actually checked out" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat proton-tkg/wine_commit_actually_checked_out.log >> "$GITHUB_STEP_SUMMARY" \
            || echo "File not found -- wine source directory never appeared." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "### Build Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nEi "error:|Error [0-9]+|FAILED:|fatal error|undefined reference" \
            proton-tkg/build.log | tail -150 >> "$GITHUB_STEP_SUMMARY" \
            || echo "No matching error lines found." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam-build-log
          path: proton-tkg/build.log

      - name: Upload Proton Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: proton-tkg-master-wow64-nosteam
          path: proton-tkg/built/**
