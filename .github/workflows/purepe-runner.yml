name: SteamFlow PurePE Runner Build

on:
  workflow_dispatch:
    inputs:
      proton_ref:
        description: "Proton tag to build (default proton-11.0-1b, the phase-3 recipe pin)"
        required: false
        type: string
        default: "proton-11.0-1b"
      dxvk_release:
        description: "DXVK release version for the clean variant (default 3.0.2)"
        required: false
        type: string
        default: "3.0.2"

jobs:
  build:
    name: Build PurePE Runners (release + rtx_remix_debug)
    # Self-hosted: the full Proton redist peaks at ~20G of disk. GitHub-hosted
    # runners expose only ~8-9G usable (14G total minus the runner image), so
    # this job cannot run there. Larger runners (ubuntu-latest-4-core) are
    # org/enterprise-only. Setup: ./setup-selfhosted-runner.sh on a machine
    # with headroom + docker/podman (ccache persists there -> fast rebuilds).
    runs-on: [self-hosted, linux, x64, steamflow-purepe]
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install host build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends file rsync
          docker --version

      # Proton's `make redist` drives the steamrt4 SDK container itself
      # (configure.sh discovers docker; ROOTLESS_CONTAINER=0 makes the
      # Makefile pass -u $(id -u):$(id -g), so all outputs are owned by the
      # runner user — no chown needed).
      - name: Build (proton make machinery spawns the SDK container)
        env:
          PROTON_REF: ${{ github.event.inputs.proton_ref }}
          DXVK_RELEASE: ${{ github.event.inputs.dxvk_release }}
        run: |
          set -euo pipefail
          chmod +x ./build-purepe.sh
          ./build-purepe.sh

      - name: Upload clean release tarball
        uses: actions/upload-artifact@v7
        with:
          name: steamflow-proton-11.0-purepe
          path: build-purepe/dist/steamflow-proton-11.0-purepe.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload rtx_remix_debug tarball
        uses: actions/upload-artifact@v7
        with:
          name: steamflow-proton-11.0-purepe-rtx_remix_debug
          path: build-purepe/dist/steamflow-proton-11.0-purepe-rtx_remix_debug.tar.gz
          retention-days: 30
          if-no-files-found: error

      # Tag push -> attach purepe files to the same tag release as
      # steamflow-runner.yml (softprops updates an existing release).
      - name: Create/update release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          update_release: true
          files: |
            build-purepe/dist/steamflow-proton-11.0-purepe.tar.gz
            build-purepe/dist/steamflow-proton-11.0-purepe-rtx_remix_debug.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
